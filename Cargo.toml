[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true


[workspace]
package = { edition = "2024", version = "0.1.0" }
resolver = "2"
members = [
  "platform/wl",

  "crates/_renderer_old",
  "crates/_graphics_old",

  "crates/canvas",
  "platform/wl",

  "crates/gui",
  "crates/input",
  "crates/graphics",

  "crates/atlas",
  "crates/wgpu_renderer",
]
default-members = ["platform/wl"]

[workspace.dependencies]
graphics_old = { path = "./crates/graphics_old" }
renderer_old = { path = "./crates/_renderer_old/" }

input = { path = "./crates/input", default-features = false }
graphics = { path = "./crates/graphics", features = ["parley"] }
gui = { path = "./crates/gui" }

atlas = { path = "./crates/atlas" }
wgpu_renderer = { path = "./crates/wgpu_renderer" }

canvas = { path = "./crates/canvas" }

anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
color-eyre = "0.6.5"
rkyv = "0.8.14"
thiserror = "2.0.17"

async-executor = "1.13.3"
futures-lite = "2.6.1"

bytemuck = "1.24.0"
bitflags = "2.10.0"
color = { version = "0.3.2", features = ["serde", "bytemuck"] }
smithay-client-toolkit = { version = "0.20.0", default-features = false }
wayland-backend = { version = "0.3.12", default-features = false }
lyon = { version = "1.0.16", features = ["serialization"] }
serde = { version = "1.0.228", features = ["derive"] }
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
log = "0.4.29"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
wgpu = { version = "28.0.0", default-features = false, features = [
  "std",
  "parking_lot",
  "vulkan",
  "wgsl",
  "webgpu",
] }

euclid = "0.22.11"

guillotiere = "0.6.2"
usvg = "0.46.0"
resvg = "0.46.0"
taffy = { version = "0.9.2", features = [ "std", "alloc", "flexbox", "grid", "block_layout", "content_size" ] }


rustc-hash = "2.1.1"

accesskit = { version = "0.23.0" }
rstar = { version = "0.12.2" }
slotmap = "1.1.1"


calloop = "0.14.3"
calloop-wayland-source = "0.4.1"

swash = { version = "0.2.6", features = ["scale"] }
# NOTE: in wasm, even though we have the system feature enabled, system fonts will not be populated.
parley = { version = "0.7.0", features = ["system"] }
# for input type conversion
winit = { version = "0.30.12" }

web-sys = { version = "0.3.85", features = ["Window", "Performance"] }

profiling = "1.0.17"


[patch.crates-io]
taffy = { path = "../taffy_rounding_patch" }
